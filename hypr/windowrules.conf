# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

windowrulev2 = workspace 1, class:Code
windowrulev2 = workspace 2, class:firefox
windowrulev2 = workspace 2, class:google-chrome
windowrulev2 = workspace 3, class:obsidian
windowrulev2 = workspace 4, class:Spotify

# `hyprctl clients`, then find "class:" field
windowrulev2 = float, class:^(org.telegram.desktop|telegramdesktop)$
windowrulev2 = size 889 865, class:^(org.telegram.desktop|telegramdesktop)$

windowrulev2 = float, class:^(discord)$
windowrulev2 = size 1000 900, class:^(discord)$  # move (1920 - x) / 2 = 460

windowrulev2 = center, class:^(vesktop)$
windowrulev2 = float, class:^(vesktop)$
windowrulev2 = size 1000 900, class:^(vesktop)$

windowrulev2 = float, class:^(org.kde.filelight)$
windowrulev2 = size 1000 800, class:^(org.kde.filelight)$

windowrulev2 = float, class:^(org.kde.dolphin)$
windowrulev2 = size 1000 600, class:^(org.kde.dolphin)$
